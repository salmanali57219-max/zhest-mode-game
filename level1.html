<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zhest Mode — Level 1</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

body{
    background:
        linear-gradient(
            180deg,
            #8ed8ff 0%,
            #b9e8ff 42%,
            #e9f8ff 100%
        );
    color:#111;
}

/* =========================
   SKY
========================= */

.sky{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
}

.sky-glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    filter:blur(20px);
    top:-170px;
    right:-100px;
}

.sun{
    position:absolute;
    width:95px;
    height:95px;
    border-radius:50%;
    background:#fff8c9;
    box-shadow:
        0 0 35px rgba(255,241,150,.8),
        0 0 90px rgba(255,255,255,.6);
    top:65px;
    left:40px;
}

.cloud{
    position:absolute;
    background:rgba(255,255,255,.72);
    border-radius:999px;
    filter:blur(.2px);
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud1{
    width:190px;
    height:45px;
    top:120px;
    left:-40px;
}

.cloud1:before{
    width:75px;
    height:75px;
    left:30px;
    top:-30px;
}

.cloud1:after{
    width:90px;
    height:90px;
    right:25px;
    top:-45px;
}

.cloud2{
    width:230px;
    height:50px;
    top:270px;
    right:-80px;
    opacity:.55;
}

.cloud2:before{
    width:85px;
    height:85px;
    left:45px;
    top:-38px;
}

.cloud2:after{
    width:70px;
    height:70px;
    right:35px;
    top:-28px;
}

.cloud3{
    width:160px;
    height:38px;
    top:48%;
    left:-70px;
    opacity:.45;
}

.cloud3:before{
    width:65px;
    height:65px;
    left:25px;
    top:-30px;
}

.cloud3:after{
    width:65px;
    height:65px;
    right:25px;
    top:-25px;
}

/* =========================
   HEADER
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:82px;
    padding:16px;
    z-index:30;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:14px;
    font-weight:900;
    letter-spacing:2px;
    color:#17212b;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(12px);
    padding:10px 14px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(31,76,104,.12);
}

.stats{
    display:flex;
    gap:8px;
}

.stat{
    min-width:74px;
    padding:8px 10px;
    border-radius:14px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(12px);
    text-align:center;
    box-shadow:0 8px 25px rgba(31,76,104,.12);
}

.stat small{
    display:block;
    font-size:9px;
    color:#667784;
    margin-bottom:2px;
}

.stat strong{
    font-size:16px;
}

/* =========================
   GAME AREA
========================= */

.game-area{
    position:fixed;
    inset:0;
    z-index:5;
    overflow:hidden;
}

/* wind lines */

.wind{
    position:absolute;
    width:110px;
    height:2px;
    background:rgba(255,255,255,.55);
    border-radius:10px;
    opacity:0;
    pointer-events:none;
}

.wind.w1{top:35%; left:-130px;}
.wind.w2{top:48%; left:-170px;}
.wind.w3{top:61%; left:-100px;}

.wind.active{
    opacity:1;
    animation:windMove 2.2s linear infinite;
}

.w2.active{
    animation-delay:.6s;
}

.w3.active{
    animation-delay:1.2s;
}

@keyframes windMove{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(calc(100vw + 300px));
    }
}

/* =========================
   CLOTHES
========================= */

.clothing{
    position:absolute;
    width:70px;
    height:70px;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    z-index:12;
    will-change:transform;
    filter:drop-shadow(0 10px 9px rgba(0,0,0,.13));
}

.clothing.small{
    width:55px;
    height:55px;
}

.clothing.large{
    width:86px;
    height:86px;
}

.clothing.gold{
    filter:
        drop-shadow(0 0 8px rgba(255,203,70,.95))
        drop-shadow(0 10px 10px rgba(0,0,0,.12));
}

.clothing.evil{
    filter:
        drop-shadow(0 0 8px rgba(255,45,45,.85))
        drop-shadow(0 10px 10px rgba(0,0,0,.18));
}

/* =========================
   RACK
========================= */

.player{
    position:absolute;
    bottom:38px;
    left:50%;
    width:135px;
    height:115px;
    transform:translateX(-50%);
    z-index:20;
    touch-action:none;
    cursor:grab;
    user-select:none;
    transition:transform .16s ease-out;
}

.player.dragging{
    cursor:grabbing;
}

.player img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    filter:drop-shadow(0 13px 12px rgba(0,0,0,.2));
}

.rack-zone{
    position:absolute;
    bottom:45px;
    left:50%;
    width:105px;
    height:55px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(255,255,255,.12);
    pointer-events:none;
}

/* =========================
   SCORE POP
========================= */

.score-pop{
    position:absolute;
    z-index:50;
    font-weight:900;
    font-size:21px;
    pointer-events:none;
    animation:scoreFloat .85s ease forwards;
}

.score-pop.plus{
    color:#15803d;
}

.score-pop.gold{
    color:#b77900;
}

.score-pop.minus{
    color:#d71920;
}

@keyframes scoreFloat{
    0%{
        opacity:0;
        transform:translateY(10px) scale(.8);
    }
    20%{
        opacity:1;
        transform:translateY(0) scale(1.05);
    }
    100%{
        opacity:0;
        transform:translateY(-55px) scale(1);
    }
}

/* =========================
   OVERLAYS
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(28,66,87,.2);
    backdrop-filter:blur(8px);
}

.panel{
    width:min(430px,100%);
    background:rgba(255,255,255,.88);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 25px 80px rgba(23,65,87,.25);
}

.panel h1{
    font-size:28px;
    margin-bottom:12px;
    color:#101820;
}

.panel p{
    color:#60717d;
    line-height:1.9;
    font-size:14px;
    margin-bottom:22px;
}

.btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:15px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    background:#111820;
    color:white;
    box-shadow:0 12px 30px rgba(17,24,32,.2);
}

.btn.secondary{
    margin-top:10px;
    background:rgba(17,24,32,.08);
    color:#17212b;
    box-shadow:none;
}

.hidden{
    display:none!important;
}

/* =========================
   DIFFICULTY INDICATOR
========================= */

.difficulty{
    position:fixed;
    top:94px;
    left:50%;
    transform:translateX(-50%);
    z-index:25;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(10px);
    border-radius:999px;
    padding:7px 13px;
    font-size:10px;
    color:#445762;
    opacity:.9;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{
        height:76px;
        padding:12px;
    }

    .brand{
        font-size:11px;
        padding:8px 10px;
    }

    .stat{
        min-width:64px;
        padding:7px 8px;
    }

    .stat strong{
        font-size:14px;
    }

    .player{
        width:120px;
        height:105px;
        bottom:30px;
    }

    .clothing{
        width:62px;
        height:62px;
    }

    .clothing.small{
        width:48px;
        height:48px;
    }

    .clothing.large{
        width:78px;
        height:78px;
    }

    .difficulty{
        top:86px;
    }
}
</style>
</head>

<body>

<!-- SKY -->
<div class="sky">
    <div class="sky-glow"></div>
    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
</div>

<!-- HEADER -->
<header class="topbar">

    <div class="brand">
        ZHEST MODE
    </div>

    <div class="stats">

        <div class="stat">
            <small>زمان</small>
            <strong id="timer">60</strong>
        </div>

        <div class="stat">
            <small>امتیاز</small>
            <strong id="score">0</strong>
        </div>

    </div>

</header>

<div class="difficulty" id="difficulty">
    مرحله ۱ · آماده شو
</div>

<!-- GAME -->
<main class="game-area" id="gameArea">

    <div class="wind w1"></div>
    <div class="wind w2"></div>
    <div class="wind w3"></div>

    <div class="rack-zone"></div>

    <div class="player" id="player">
        <img src="assets/level1/rack.png" alt="Clothing Rack">
    </div>

</main>

<!-- INTRO -->
<div class="overlay" id="intro">

    <div class="panel">

        <h1>لباس‌ها رو نجات بده.</h1>

        <p>
            لباس‌ها از آسمان سقوط می‌کنند.
            رگال را حرکت بده و لباس‌ها را قبل از سقوط بگیر.
            <br><br>
            🟡 طلایی = +2
            <br>
            🔴 لباس شیطانی = -10
            <br>
            لباس معمولی = +1
            <br>
            سقوط لباس = -5
        </p>

        <button class="btn" id="startBtn">
            شروع بازی
        </button>

    </div>

</div>

<!-- RESULT -->
<div class="overlay hidden" id="result">

    <div class="panel">

        <h1 id="resultTitle">بازی تمام شد</h1>

        <p id="resultText"></p>

        <button class="btn" id="replayBtn">
            دوباره بازی کن
        </button>

        <button class="btn secondary" id="hubBtn">
            بازگشت به Game Hub
        </button>

    </div>

</div>

<script>

/* =========================================================
   CONFIG
========================================================= */

const GAME_DURATION = 60;

const NORMAL_SCORE = 1;
const GOLD_SCORE = 2;
const EVIL_SCORE = -10;
const MISS_SCORE = -5;

let score = 0;
let timeLeft = GAME_DURATION;

let gameRunning = false;
let gameStarted = false;

let timerInterval = null;
let spawnTimeout = null;

let clothes = [];

let rackX = window.innerWidth / 2;

/* =========================================================
   ASSETS
========================================================= */

const CLOTHING_TYPES = [

    {
        src:"assets/level1/tshirt.png",
        type:"normal",
        value:1,
        size:"normal",
        speed:1
    },

    {
        src:"assets/level1/shirt.png",
        type:"normal",
        value:1,
        size:"normal",
        speed:1.08
    },

    {
        src:"assets/level1/dress.png",
        type:"normal",
        value:1,
        size:"large",
        speed:.94
    },

    {
        src:"assets/level1/jacket.png",
        type:"normal",
        value:1,
        size:"large",
        speed:1.15
    },

    {
        src:"assets/level1/pants.png",
        type:"normal",
        value:1,
        size:"normal",
        speed:1.05
    },

    {
        src:"assets/level1/hoodie.png",
        type:"normal",
        value:1,
        size:"large",
        speed:.98
    },

    /* GOLD */
    {
        src:"assets/level1/gold.png",
        type:"gold",
        value:2,
        size:"normal",
        speed:1.35
    },

    /* EVIL */
    {
        src:"assets/level1/evil-red.png",
        type:"evil",
        value:-10,
        size:"normal",
        speed:1.12
    },

    {
        src:"assets/level1/evil-red.png",
        type:"evil",
        value:-10,
        size:"small",
        speed:1.25
    }

];


/* =========================================================
   DOM
========================================================= */

const gameArea = document.getElementById("gameArea");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");

const intro = document.getElementById("intro");
const result = document.getElementById("result");

const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

const difficultyEl = document.getElementById("difficulty");

const startBtn = document.getElementById("startBtn");
const replayBtn = document.getElementById("replayBtn");
const hubBtn = document.getElementById("hubBtn");

const winds = document.querySelectorAll(".wind");


/* =========================================================
   RANDOM
========================================================= */

function random(min,max){
    return Math.random() * (max-min) + min;
}


/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficulty(){

    const elapsed = GAME_DURATION - timeLeft;

    if(elapsed < 15){

        return {
            speed:1,
            spawn:2200,
            label:"مرحله ۱ · آرام"
        };

    }

    if(elapsed < 30){

        return {
            speed:1.25,
            spawn:2000,
            label:"مرحله ۱ · سریع‌تر"
        };

    }

    if(elapsed < 45){

        return {
            speed:1.55,
            spawn:1800,
            label:"مرحله ۱ · سخت"
        };

    }

    return {
        speed:1.9,
        spawn:1550,
        label:"مرحله ۱ · باد و سرعت"
    };
}


/* =========================================================
   SPAWN SELECTION
========================================================= */

function chooseClothing(){

    /*
       لباس قرمز عمداً شانس نسبتاً بالایی دارد.
    */

    const randomNumber = Math.random();

    if(randomNumber < .22){

        return CLOTHING_TYPES.find(x => x.type === "evil");

    }

    if(randomNumber < .32){

        return CLOTHING_TYPES.find(x => x.type === "gold");

    }

    const normalItems =
        CLOTHING_TYPES.filter(x => x.type === "normal");

    return normalItems[
        Math.floor(Math.random()*normalItems.length)
    ];
}


/* =========================================================
   SPAWN CLOTHING
========================================================= */

function spawnClothing(){

    if(!gameRunning) return;

    /*
       برای جلوگیری از شلوغ شدن بیش از حد،
       همزمان بیشتر از 3 لباس روی صفحه نباشد.
    */

    if(clothes.length >= 3){
        scheduleNextSpawn();
        return;
    }

    const config = chooseClothing();

    const item = document.createElement("img");

    item.src = config.src;
    item.className = "clothing";

    if(config.size === "small"){
        item.classList.add("small");
    }

    if(config.size === "large"){
        item.classList.add("large");
    }

    if(config.type === "gold"){
        item.classList.add("gold");
    }

    if(config.type === "evil"){
        item.classList.add("evil");
    }

    const startX =
        random(35, window.innerWidth - 35);

    const startY = -90;

    item.style.left = startX + "px";
    item.style.top = startY + "px";

    gameArea.appendChild(item);

    const clothing = {
        el:item,
        config:config,
        x:startX,
        y:startY,
        startX:startX,
        drift:random(-.35,.35),
        rotation:random(-8,8),
        caught:false,
        createdAt:performance.now()
    };

    clothes.push(clothing);

    animateClothing(clothing);

    scheduleNextSpawn();
}


/* =========================================================
   SPAWN TIMER
========================================================= */

function scheduleNextSpawn(){

    if(!gameRunning) return;

    const difficulty = getDifficulty();

    /*
       کمی تصادفی بودن باعث می‌شود بازیکن
       نتواند دقیقاً زمان ظاهر شدن لباس بعدی را حفظ کند.
    */

    const randomDelay =
        random(-250,450);

    spawnTimeout = setTimeout(
        spawnClothing,
        Math.max(900, difficulty.spawn + randomDelay)
    );
}


/* =========================================================
   ANIMATE CLOTHING
========================================================= */

function animateClothing(item){

    const started = performance.now();

    const baseFallSpeed =
        random(95,125) * item.config.speed;

    function frame(now){

        if(!gameRunning || item.caught){
            return;
        }

        const elapsed =
            (now - started) / 1000;

        const difficulty =
            getDifficulty();

        const windPower =
            timeLeft <= 15 ? 1 : 0;

        /*
           سرعت با گذشت زمان بیشتر می‌شود.
        */

        item.y +=
            baseFallSpeed *
            difficulty.speed *
            .016;

        /*
           باد در 15 ثانیه آخر
        */

        if(windPower){

            item.x +=
                Math.sin(now / 330) *
                .85;

            item.x += item.drift;

        }

        /*
           کمی حرکت طبیعی لباس
        */

        const wobble =
            Math.sin(now / 260 + item.startX) * 7;

        item.el.style.transform =
            `translate(-50%,0)
             translateX(${item.x - item.startX + wobble}px)
             rotate(${item.rotation + Math.sin(now/500)*5}deg)`;

        item.el.style.top =
            item.y + "px";

        /*
           برخورد
        */

        if(checkCollision(item)){

            catchClothing(item);

            return;
        }

        /*
           اگر از پایین خارج شد
        */

        if(item.y > window.innerHeight + 100){

            missClothing(item);

            return;
        }

        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
}


/* =========================================================
   COLLISION
========================================================= */

function checkCollision(item){

    const rackRect =
        player.getBoundingClientRect();

    const clothingRect =
        item.el.getBoundingClientRect();

    /*
       کمی سخت‌تر از برخورد کامل:
       لباس باید واقعاً وارد محدوده رگال شود.
    */

    return !(
        clothingRect.right < rackRect.left + 15 ||
        clothingRect.left > rackRect.right - 15 ||
        clothingRect.bottom < rackRect.top + 15 ||
        clothingRect.top > rackRect.bottom
    );
}


/* =========================================================
   CATCH
========================================================= */

function catchClothing(item){

    if(item.caught) return;

    item.caught = true;

    score += item.config.value;

    updateScore();

    showScore(
        item.el,
        item.config.value,
        item.config.type
    );

    removeClothing(item);
}


/* =========================================================
   MISS
========================================================= */

function missClothing(item){

    if(item.caught) return;

    item.caught = true;

    score += MISS_SCORE;

    updateScore();

    showScore(
        item.el,
        MISS_SCORE,
        "miss"
    );

    removeClothing(item);
}


/* =========================================================
   REMOVE
========================================================= */

function removeClothing(item){

    item.el.remove();

    clothes =
        clothes.filter(
            x => x !== item
        );
}


/* =========================================================
   SCORE
========================================================= */

function updateScore(){

    scoreEl.textContent = score;

    /*
       رنگ امتیاز در Header
    */

    if(score > 0){
        scoreEl.style.color = "#15803d";
    }

    if(score < 0){
        scoreEl.style.color = "#d71920";
    }

    if(score === 0){
        scoreEl.style.color = "#111";
    }
}


/* =========================================================
   SCORE POP
========================================================= */

function showScore(target,value,type){

    const pop =
        document.createElement("div");

    pop.className = "score-pop";

    if(type === "evil" || type === "miss"){
        pop.classList.add("minus");
    }
    else if(type === "gold"){
        pop.classList.add("gold");
    }
    else{
        pop.classList.add("plus");
    }

    pop.textContent =
        value > 0
            ? "+" + value
            : value;

    const rect =
        target.getBoundingClientRect();

    pop.style.left =
        rect.left + rect.width/2 + "px";

    pop.style.top =
        rect.top + "px";

    document.body.appendChild(pop);

    setTimeout(()=>{
        pop.remove();
    },850);
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    timerInterval =
        setInterval(()=>{

            if(!gameRunning) return;

            timeLeft--;

            timerEl.textContent =
                timeLeft;

            updateDifficulty();

            if(timeLeft <= 15){

                winds.forEach(
                    wind =>
                    wind.classList.add("active")
                );

            }

            if(timeLeft <= 0){

                endGame();

            }

        },1000);
}


/* =========================================================
   DIFFICULTY UI
========================================================= */

function updateDifficulty(){

    const difficulty =
        getDifficulty();

    difficultyEl.textContent =
        difficulty.label;
}


/* =========================================================
   START
========================================================= */

function startGame(){

    score = 0;
    timeLeft = GAME_DURATION;

    clothes.forEach(
        item => item.el.remove()
    );

    clothes = [];

    updateScore();

    timerEl.textContent =
        timeLeft;

    difficultyEl.textContent =
        "مرحله ۱ · آرام";

    winds.forEach(
        wind =>
        wind.classList.remove("active")
    );

    intro.classList.add("hidden");
    result.classList.add("hidden");

    gameRunning = true;
    gameStarted = true;

    startTimer();

    scheduleNextSpawn();
}


/* =========================================================
   END
========================================================= */

function endGame(){

    gameRunning = false;

    clearInterval(timerInterval);
    clearTimeout(spawnTimeout);

    winds.forEach(
        wind =>
        wind.classList.remove("active")
    );

    clothes.forEach(
        item =>
        item.el.remove()
    );

    clothes = [];

    if(score >= 15){

        resultTitle.textContent =
            "Level 2 باز شد 🔓";

        resultText.innerHTML =
            `
            امتیاز نهایی شما:
            <strong>${score}</strong>
            <br><br>
            عالی بود.
            شما به امتیاز لازم برای ورود به مرحله بعد رسیدید.
            `;

    }
    else{

        resultTitle.textContent =
            "هنوز باز نشده";

        resultText.innerHTML =
            `
            امتیاز نهایی شما:
            <strong>${score}</strong>
            <br><br>
            برای باز کردن Level 2
            باید حداقل به <strong>+15</strong> برسید.
            `;
    }

    result.classList.remove("hidden");
}


/* =========================================================
   RACK CONTROL
========================================================= */

let dragging = false;

let targetX =
    window.innerWidth / 2;

let currentX =
    window.innerWidth / 2;


/*
   رگال عمداً با تأخیر حرکت می‌کند.
   یعنی حرکت انگشت/ماوس مستقیم و فوری نیست.
*/

function moveRack(clientX){

    targetX =
        Math.max(
            75,
            Math.min(
                window.innerWidth - 75,
                clientX
            )
        );
}


/* mouse */

player.addEventListener("mousedown",()=>{
    dragging = true;
    player.classList.add("dragging");
});

window.addEventListener("mouseup",()=>{
    dragging = false;
    player.classList.remove("dragging");
});

window.addEventListener("mousemove",(e)=>{

    if(!dragging) return;

    moveRack(e.clientX);

});


/* touch */

player.addEventListener(
    "touchstart",
    (e)=>{

        dragging = true;

        const touch =
            e.touches[0];

        moveRack(
            touch.clientX
        );

    },
    {passive:true}
);

window.addEventListener(
    "touchmove",
    (e)=>{

        if(!dragging) return;

        const touch =
            e.touches[0];

        moveRack(
            touch.clientX
        );

    },
    {passive:true}
);

window.addEventListener(
    "touchend",
    ()=>{
        dragging = false;
    }
);


/* =========================================================
   RACK SMOOTH / SLOW MOVEMENT
========================================================= */

function animateRack(){

    /*
       این قسمت باعث می‌شود رگال سریعاً
       به انگشت/ماوس نچسبد.
    */

    currentX +=
        (targetX - currentX) * .075;

    player.style.left =
        currentX + "px";

    requestAnimationFrame(
        animateRack
    );
}

animateRack();


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);

replayBtn.addEventListener(
    "click",
    startGame
);

hubBtn.addEventListener(
    "click",
    ()=>{
        window.location.href =
            "game.html";
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        targetX =
            Math.min(
                targetX,
                window.innerWidth - 75
            );

    }
);

</script>
